name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kopieer index.html naar vaste routes (HTTP 200 per pagina)
        run: |
          for route in \
            werkwijze \
            werkwijze/gratis-ophalen \
            werkwijze/datawissing-op-locatie \
            wat-wij-aannemen \
            over-ons \
            contact \
            privacy; do
            mkdir -p dist/$route
            cp dist/index.html dist/$route/index.html
          done
      - name: Genereer custom HTML per locatiepagina
        run: node scripts/generate-city-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
